name: 'git-tag-to-jira-release'
description: 'Creates a JIRA release based on a git tag'
author: 'Hallo Verden'
inputs:
  jira_host:
    required: true
    description:
      'hostname of your JIRA instance (eg. yourcompany.atlassian.net)'
  jira_username:
    required: true
    description: 'Your JIRA email'
  jira_password:
    required: true
    description: 'Your JIRA API token'
  jira_project:
    required: true
    description: 'The JIRA project key'
  jira_api_version:
    required: true
    description: 'Jira API version'
    default: '3'
runs:
  using: 'node20'
  main: 'dist/index.js'
